site:
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
scripts:
  - changed-files:
      - any-glob-to-any-file: ["scripts/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
