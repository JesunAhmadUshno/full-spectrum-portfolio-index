name: Verify live

# Weekly read-only re-check of the README's verdict table against each repo's live README and proposal-v1 tag.
# A failure means the README is stale, not that a project broke.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_live.py
        env:
          GH_TOKEN: ${{ github.token }}
