name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README consistency smoke test
        run: python tests/test_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: README known-answer check (same parser as the site)
        run: node site/src/index.check.mjs
